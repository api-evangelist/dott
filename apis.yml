aid: dott
name: Dott
description: >-
  Dott is a European shared micromobility operator running fleets of electric scooters and
  e-bikes across 250+ cities in Europe and the Middle East. Formed from the 2024 merger of
  Dott and TIER (the TIER brand was retired into the Dott app that year), the company is
  headquartered in Amsterdam, Berlin and Paris. For developers and mobility-data partners,
  Dott publishes its fleet data through the open GBFS 2.3 standard: real-time vehicle
  locations, vehicle types, per-city pricing plans, geofencing zones and station data are
  served from gbfs.api.ridedott.com, with an authenticated partner variant carrying stable
  (non-rotating) vehicle IDs. Originally added to the API Evangelist network as a SoftBank
  Vision Fund portfolio lead, enriched from its live public developer surface.
